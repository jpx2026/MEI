version: '3'
services:
  backend:
    build: .
    container_name: flask_backend
    restart: always
    ports:
      - "8081:8081"
  nginx:
    image: nginx:alpine
    container_name: nginx_front
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    depends_on:
      - backend